# Starts only the external services needed when running TaiseChat itself locally.
# Usage: docker compose -f taise-external-docker-compose.yml up -d

services:
  mongodb:
    container_name: taisechat-mongodb
    image: mongo:8.0.20
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - ./data-node:/data/db
    command: mongod --noauth

  meilisearch:
    container_name: taisechat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env}
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - ./meili_data_v1.35.1:/meili_data

  vectordb:
    container_name: taisechat-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "127.0.0.1:${PGVECTOR_PORT:-5433}:5432"
    volumes:
      - taisechat-pgdata:/var/lib/postgresql/data

  rag_api:
    container_name: taisechat-rag-api
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:latest
    restart: unless-stopped
    depends_on:
      - vectordb
    environment:
      - DB_HOST=vectordb
      - DB_PORT=5432
      - POSTGRES_DB=mydatabase
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - RAG_PORT=${RAG_PORT:-8000}
      - EMBEDDINGS_PROVIDER=${EMBEDDINGS_PROVIDER:-openai}
      - EMBEDDINGS_MODEL=${EMBEDDINGS_MODEL:-text-embedding-3-small}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - RAG_OPENAI_BASEURL=${RAG_OPENAI_BASEURL:-}
      - RAG_OPENAI_API_KEY=${RAG_OPENAI_API_KEY:-}
      - RAG_USE_FULL_CONTEXT=${RAG_USE_FULL_CONTEXT:-}
    ports:
      - "127.0.0.1:${RAG_PORT:-8000}:${RAG_PORT:-8000}"

volumes:
  taisechat-pgdata:
